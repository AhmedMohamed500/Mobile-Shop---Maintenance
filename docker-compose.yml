services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: repair_erp
      POSTGRES_USER: repair
      POSTGRES_PASSWORD: repair
    ports:
      - "5432:5432"
    volumes:
      - repair-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repair -d repair_erp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  repair-postgres:
